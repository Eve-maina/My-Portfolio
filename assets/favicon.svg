<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sky" cx="30%" cy="20%" r="90%">
      <stop offset="0" stop-color="#1a2366"/>
      <stop offset="1" stop-color="#050814"/>
    </radialGradient>
    <linearGradient id="planet" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#7ff4ff"/>
      <stop offset="0.5" stop-color="#3ee8ff"/>
      <stop offset="1" stop-color="#8a6cf0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b69cff"/>
      <stop offset="1" stop-color="#3ee8ff"/>
    </linearGradient>
  </defs>

  <!-- Night sky tile -->
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>

  <!-- Back half of the orbit ring, behind the planet -->
  <path d="M7 38 A26 9 -20 0 1 57 22" fill="none" stroke="url(#ring)" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Planet with a keyhole for security -->
  <circle cx="32" cy="31" r="15" fill="url(#planet)"/>
  <circle cx="32" cy="28" r="3.6" fill="#050814"/>
  <path d="M30.2 30 h3.6 l1.2 7.5 h-6 z" fill="#050814"/>

  <!-- Front half of the orbit ring, across the planet -->
  <path d="M57 22 A26 9 -20 0 1 7 38" fill="none" stroke="url(#ring)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- A bright star -->
  <path d="M52 8 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6 z" fill="#ffffff"/>
  <circle cx="12" cy="13" r="1.4" fill="#ffffff" opacity="0.8"/>
</svg>
